spring:
  application:
    name: ib-trader

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ── Database ──────────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ibtrader}
    username: ${DB_USERNAME:ibtrader}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: IbTraderPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
      auto-commit: false

  # ── JPA / Hibernate ───────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        generate_statistics: false

  # ── Flyway ────────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    repair: true

  # ── Jackson ───────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 50
      min-spare: 10
    connection-timeout: 20000
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, loggers, flyway
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.ibtrader.api.controller

# ══════════════════════════════════════════════════════════════════════════════
# Application configuration
# ══════════════════════════════════════════════════════════════════════════════
app:

  # ── Interactive Brokers ───────────────────────────────────────────────────────
  ib:
    accounts:
      default:
        paper: DUP854695
        live: DUP854695
    enabled: ${IB_ENABLED:false}
    host: ${IB_HOST:127.0.0.1}
    port: ${IB_PORT:4002}              # 4002 = paper trading gateway; 4001 = live
    client-id: ${IB_CLIENT_ID:1}
    paper-trading: ${IB_PAPER_TRADING:true}
    account-id: ${IB_ACCOUNT_ID:DUP854695}
    connection:
      reconnect-interval-seconds: 30
      heartbeat-interval-seconds: 60
      max-reconnect-attempts: 20
      connection-timeout-seconds: 15
    orders:
      use-adaptive-algo: false
      tif: DAY

  # ── Portfolio ─────────────────────────────────────────────────────────────────
  portfolio:
    snapshot-interval-seconds: 5
    snapshot-retention-days: 90
    staleness-threshold-seconds: 30

  # ── Strategy ──────────────────────────────────────────────────────────────────
  strategy:
    evaluation-interval-seconds: 30
    default-strategy-name: primary
    default-mode: FULL_REBALANCE

    thresholds:
      buy-nlv: ${STRATEGY_BUY_NLV:25000.00}
      sell-nlv: ${STRATEGY_SELL_NLV:35000.00}

    fixed-amount-per-asset-usd: ${STRATEGY_FIXED_AMOUNT:1000.00}

    allocation-targets:
      SPY: 30.0
      QQQ: 40.0
      VOO: 20.0
      MNQ: 10.0

    rebalance:
      drift-threshold-pct: 5.0
      min-trade-value-usd: 100.00
      require-approval: false

  # ── Asset Registry ────────────────────────────────────────────────────────────
  assets:
    - symbol: SPY
      exchange: SMART
      currency: USD
      asset-class: ETF
      enabled: true
    - symbol: QQQ
      exchange: SMART
      currency: USD
      asset-class: ETF
      enabled: true
    - symbol: VOO
      exchange: SMART
      currency: USD
      asset-class: ETF
      enabled: true
    - symbol: MES
      exchange: CME
      currency: USD
      asset-class: FUTURES
      enabled: true
      multiplier: 5
      local-symbol: ""
    - symbol: MNQ
      exchange: CME
      currency: USD
      asset-class: FUTURES
      enabled: true
      multiplier: 2
      local-symbol: ""
    - symbol: GOOGL
      exchange: SMART
      currency: USD
      asset-class: STOCK
      enabled: true
    - symbol: MSFT
      exchange: SMART
      currency: USD
      asset-class: STOCK
      enabled: true

  # ── Market Data ───────────────────────────────────────────────────────────────
  market-data:
    price-staleness-seconds: 60
    subscription-delay-ms: 500

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.ibtrader: DEBUG
    com.ib.client: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_DIR:logs}/ib-trader.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
